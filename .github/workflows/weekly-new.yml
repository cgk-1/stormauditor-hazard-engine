name: hazard-v2-weekly-newdb
on:
  schedule:
    - cron: "50 7 * * 1"
  workflow_dispatch:
    inputs:
      ncei_years: {description: "e.g. 2024,2025,2026", required: false}
      dry_run: {description: "1 = compute everything, write nothing", required: false}
      day_convention: {description: "v3 (default, empty) or v4 (Phase 5: adds hz_storm_events_v4; dry-run first, owner OK before any write)", required: false}
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - env:
          SUPABASE_URL: https://aozjsfjemobuzqrhxcxy.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvempzZmplbW9idXpxcmh4Y3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NzMyODIsImV4cCI6MjEwMDI0OTI4Mn0.gYwwzMcT4VCuTyWHNXlm8viyeGOsv7isfNgegYAmcV8
          INGEST_SECRET: ${{ secrets.INGEST_SECRET_NEW }}
          TASKS: stations,ncei,hurdat
          NCEI_YEARS: ${{ github.event.inputs.ncei_years }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          DAY_CONVENTION: ${{ github.event.inputs.day_convention }}
          FEED_OUT_DIR: feed-out
        run: python hazard_obs_ingest.py
      - name: Upload run record (summary JSON, quarantine records, dry-run payloads)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-out-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: feed-out
          if-no-files-found: ignore
          retention-days: 30
