name: stage6-stage
# Archive Stage 6 - TEMPORARY STAGING ONLY (owner-approved plan 2026-10-09, "S1 Finish staging"; recorded in
# stormwatch-insight CLAUDE.md AUTOMATION RULES). Runs the feeds' own v4 code in DRY_RUN for the remaining
# middle-stretch days and loads the saved write calls into the staging table hz_s6_payload (hz_s6_load).
# Writes NOTHING to live tables. Manual start only (no schedule); the chain job re-dispatches only while days
# remain AND the run made progress. Same no-work windows as Stage 5. Stop = disable this workflow.
on:
  workflow_dispatch:
    inputs:
      lanes: {description: "Comma list of HAIL,ANL,HRRR (default all).", required: false}
permissions:
  actions: write
  contents: read
concurrency: {group: stage6-stage, cancel-in-progress: false}
env:
  SUPABASE_URL: https://aozjsfjemobuzqrhxcxy.supabase.co
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvempzZmplbW9idXpxcmh4Y3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NzMyODIsImV4cCI6MjEwMDI0OTI4Mn0.gYwwzMcT4VCuTyWHNXlm8viyeGOsv7isfNgegYAmcV8
  LANES: ${{ github.event.inputs.lanes }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      go: ${{ steps.plan.outputs.go }}
      remaining: ${{ steps.plan.outputs.remaining }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - id: plan
        env:
          MODE: plan
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python stage6_stage.py
  shard:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.lane }}-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with: {path: hazard}
      - uses: actions/checkout@v4
        with: {repository: cgk-1/stormauditor-hail-feed, ref: main, path: hail}
      - uses: actions/checkout@v4
        with: {repository: cgk-1/stormauditor-wind-feed, ref: main, path: wind}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: System deps
        run: sudo apt-get update -q && sudo apt-get install -y -q libeccodes-dev
      - name: Python deps (wind-feed pins = the superset, as in stage5)
        run: pip install -r wind/requirements.txt
      - name: Stage
        working-directory: hazard
        env:
          MODE: shard
          LANE: ${{ matrix.lane }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET_NEW }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HAIL_DIR: ${{ github.workspace }}/hail
          WIND_DIR: ${{ github.workspace }}/wind
          HAZARD_DIR: ${{ github.workspace }}/hazard
          OUT_DIR: ${{ github.workspace }}/feed-out
          TIME_BUDGET_MIN: "320"
        run: python stage6_stage.py
  chain:
    needs: [plan, shard]
    if: ${{ !cancelled() && needs.plan.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - env:
          MODE: chain
          REMAINING_BEFORE: ${{ needs.plan.outputs.remaining }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python stage6_stage.py
