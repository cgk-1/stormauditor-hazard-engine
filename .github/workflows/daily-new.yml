name: hazard-v2-daily-newdb
on:
  schedule:
    - cron: "20 9 * * *"       # after all CONUS local days close + HRRR delay
  workflow_dispatch:
    inputs:
      ingest_date: {description: "local date(s): YYYY-MM-DD, YYYYMMDD, START..END or a:b, comma lists", required: false}
      tasks: {description: "obs tasks", default: "dailies,peaks,lsr"}
      run_hrrr: {description: "run the HRRR job (set false for obs-only)", default: "true"}
      dry_run: {description: "1 = compute everything, write nothing", required: false}
      day_convention: {description: "Empty = v4 (own-zone local days, nightly default since Stage 4, owner-approved 2026-10-07; obs writes the v3 tables AND the v4 tables). v3 = rollback/override only.", required: false}
      clear_step: {description: "HRRR, explicit dates only: 1 (default) = after a fully successful day, clear stale rows of states not re-supplied (hz_day_clear_states_v2). 0 = off.", required: false}
      redo_run_id: {description: "Explicit dates only: name of the redo-shadow run (default <feed>-<run id>), e.g. wind-repair-c1.", required: false}
      redo_release: {description: "Explicit dates only: 1 = release the day's redo shadow when the post-write row counts match the payload. Default 0 = keep it for release after the blind verifier.", required: false}
# One run at a time; a second trigger queues behind the first (never cancels it).
concurrency: {group: hazard-daily, cancel-in-progress: false}
jobs:
  hrrr:
    if: ${{ github.event.inputs.run_hrrr != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update -q && sudo apt-get install -y -q libeccodes-dev
      - run: pip install -r requirements.txt
      - env:
          SUPABASE_URL: https://aozjsfjemobuzqrhxcxy.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvempzZmplbW9idXpxcmh4Y3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NzMyODIsImV4cCI6MjEwMDI0OTI4Mn0.gYwwzMcT4VCuTyWHNXlm8viyeGOsv7isfNgegYAmcV8
          INGEST_SECRET: ${{ secrets.INGEST_SECRET_NEW }}
          INGEST_DATE: ${{ github.event.inputs.ingest_date }}
          FLOOR_MPH: "35"
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          DAY_CONVENTION: ${{ github.event.inputs.day_convention || 'v4' }}
          CLEAR_STEP: ${{ github.event.inputs.clear_step }}
          REDO_RUN_ID: ${{ github.event.inputs.redo_run_id }}
          REDO_RELEASE: ${{ github.event.inputs.redo_release }}
          FEED_OUT_DIR: feed-out
        run: python hz_hrrr_ingest.py
      - name: Upload run record (summary JSON, quarantine records, dry-run payloads)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-out-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: feed-out
          if-no-files-found: ignore
          retention-days: 30
  obs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - env:
          SUPABASE_URL: https://aozjsfjemobuzqrhxcxy.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvempzZmplbW9idXpxcmh4Y3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NzMyODIsImV4cCI6MjEwMDI0OTI4Mn0.gYwwzMcT4VCuTyWHNXlm8viyeGOsv7isfNgegYAmcV8
          INGEST_SECRET: ${{ secrets.INGEST_SECRET_NEW }}
          INGEST_DATE: ${{ github.event.inputs.ingest_date }}
          TASKS: ${{ github.event.inputs.tasks || 'dailies,peaks,lsr' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          REDO_RUN_ID: ${{ github.event.inputs.redo_run_id }}
          DAY_CONVENTION: ${{ github.event.inputs.day_convention || 'v4' }}
          FEED_OUT_DIR: feed-out
        run: python hazard_obs_ingest.py
      - name: Upload run record (summary JSON, quarantine records, dry-run payloads)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-out-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: feed-out
          if-no-files-found: ignore
          retention-days: 30
