name: hazard-v2-daily-newdb
on:
  schedule:
    - cron: "20 9 * * *"       # after all CONUS local days close + HRRR delay
  workflow_dispatch:
    inputs:
      ingest_date: {description: "local date(s): YYYY-MM-DD, YYYYMMDD, START..END or a:b, comma lists", required: false}
      tasks: {description: "obs tasks", default: "dailies,peaks,lsr"}
      run_hrrr: {description: "run the HRRR job (set false for obs-only)", default: "true"}
      dry_run: {description: "1 = compute everything, write nothing", required: false}
      day_convention: {description: "v3 (default, empty) or v4 (Phase 5 own-zone local days; dry-run first, owner OK before any write)", required: false}
# One run at a time; a second trigger queues behind the first (never cancels it).
concurrency: {group: hazard-daily, cancel-in-progress: false}
jobs:
  hrrr:
    if: ${{ github.event.inputs.run_hrrr != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update -q && sudo apt-get install -y -q libeccodes-dev
      - run: pip install -r requirements.txt
      - env:
          SUPABASE_URL: https://aozjsfjemobuzqrhxcxy.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvempzZmplbW9idXpxcmh4Y3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NzMyODIsImV4cCI6MjEwMDI0OTI4Mn0.gYwwzMcT4VCuTyWHNXlm8viyeGOsv7isfNgegYAmcV8
          INGEST_SECRET: ${{ secrets.INGEST_SECRET_NEW }}
          INGEST_DATE: ${{ github.event.inputs.ingest_date }}
          FLOOR_MPH: "35"
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          DAY_CONVENTION: ${{ github.event.inputs.day_convention }}
          FEED_OUT_DIR: feed-out
        run: python hz_hrrr_ingest.py
      - name: Upload run record (summary JSON, quarantine records, dry-run payloads)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-out-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: feed-out
          if-no-files-found: ignore
          retention-days: 30
  obs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - env:
          SUPABASE_URL: https://aozjsfjemobuzqrhxcxy.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvempzZmplbW9idXpxcmh4Y3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NzMyODIsImV4cCI6MjEwMDI0OTI4Mn0.gYwwzMcT4VCuTyWHNXlm8viyeGOsv7isfNgegYAmcV8
          INGEST_SECRET: ${{ secrets.INGEST_SECRET_NEW }}
          INGEST_DATE: ${{ github.event.inputs.ingest_date }}
          TASKS: ${{ github.event.inputs.tasks || 'dailies,peaks,lsr' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          DAY_CONVENTION: ${{ github.event.inputs.day_convention }}
          FEED_OUT_DIR: feed-out
        run: python hazard_obs_ingest.py
      - name: Upload run record (summary JSON, quarantine records, dry-run payloads)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-out-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: feed-out
          if-no-files-found: ignore
          retention-days: 30
